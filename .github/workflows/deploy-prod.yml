name: Deploy production backend

on:
  push:
    branches:
      - main

concurrency:
  group: production-deployment
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  test:
    name: Safe backend tests
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            backend/requirements.txt

      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Run isolated infrastructure tests
        run: python -m unittest backend.test_cors backend.test_mobile_otp -v

  build:
    name: Build and publish ARM64 image
    needs: test
    runs-on: ubuntu-22.04
    outputs:
      image: ${{ steps.image.outputs.sha_image }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Derive lowercase image name
        id: image
        shell: bash
        run: |
          set -Eeuo pipefail
          image_name="${REGISTRY}/${GITHUB_REPOSITORY,,}"
          echo "name=${image_name}" >> "$GITHUB_OUTPUT"
          echo "sha_image=${image_name}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push immutable ARM64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.sha_image }}
            ${{ steps.image.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy exact image to Oracle
    needs: build
    runs-on: ubuntu-22.04
    environment: production
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure SSH with strict host verification
        shell: bash
        env:
          OCI_HOST: ${{ secrets.OCI_HOST }}
          OCI_SSH_PORT: ${{ secrets.OCI_SSH_PORT }}
          OCI_SSH_PRIVATE_KEY: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
        run: |
          set -Eeuo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$OCI_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_oci"
          chmod 600 "$HOME/.ssh/id_oci"
          ssh-keyscan -p "$OCI_SSH_PORT" -H "$OCI_HOST" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Upload production Compose definition
        shell: bash
        env:
          OCI_HOST: ${{ secrets.OCI_HOST }}
          OCI_USER: ${{ secrets.OCI_USER }}
          OCI_SSH_PORT: ${{ secrets.OCI_SSH_PORT }}
        run: |
          set -Eeuo pipefail
          scp -i "$HOME/.ssh/id_oci" -P "$OCI_SSH_PORT" \
            docker-compose.prod.yml \
            "${OCI_USER}@${OCI_HOST}:/opt/ssjewellery/docker-compose.prod.yml"

      - name: Migrate and deploy backend
        shell: bash
        env:
          OCI_HOST: ${{ secrets.OCI_HOST }}
          OCI_USER: ${{ secrets.OCI_USER }}
          OCI_SSH_PORT: ${{ secrets.OCI_SSH_PORT }}
          BACKEND_IMAGE: ${{ needs.build.outputs.image }}
        run: |
          set -Eeuo pipefail
          ssh -i "$HOME/.ssh/id_oci" -p "$OCI_SSH_PORT" \
            "${OCI_USER}@${OCI_HOST}" bash -s -- "$BACKEND_IMAGE" <<'REMOTE_SCRIPT'
          set -Eeuo pipefail

          readonly ROOT=/opt/ssjewellery
          readonly DEPLOY_DIR="$ROOT/deploy"
          readonly COMPOSE_FILE="$ROOT/docker-compose.prod.yml"
          readonly CURRENT_IMAGE_FILE="$DEPLOY_DIR/current-image.env"
          readonly PREVIOUS_IMAGE_FILE="$DEPLOY_DIR/previous-image.env"
          readonly NEW_IMAGE="$1"

          mkdir -p "$DEPLOY_DIR" "$ROOT/uploads"
          test -f "$ROOT/.env"
          test -f "$COMPOSE_FILE"

          echo "Pulling immutable backend image: $NEW_IMAGE"
          docker pull "$NEW_IMAGE"

          echo "Running database migrations before backend replacement"
          BACKEND_IMAGE="$NEW_IMAGE" docker compose -f "$COMPOSE_FILE" \
            run --rm --no-deps backend flask --app backend.app db upgrade

          if [[ -f "$CURRENT_IMAGE_FILE" ]]; then
            cp "$CURRENT_IMAGE_FILE" "$PREVIOUS_IMAGE_FILE"
          fi
          printf 'BACKEND_IMAGE=%s\n' "$NEW_IMAGE" > "$CURRENT_IMAGE_FILE.tmp"
          mv "$CURRENT_IMAGE_FILE.tmp" "$CURRENT_IMAGE_FILE"

          docker compose --env-file "$CURRENT_IMAGE_FILE" -f "$COMPOSE_FILE" \
            up -d --no-deps --force-recreate backend

          healthy=false
          for attempt in $(seq 1 36); do
            if curl --fail --silent --show-error --max-time 5 \
              http://127.0.0.1:5005/health >/dev/null; then
              healthy=true
              break
            fi
            echo "Waiting for backend health ($attempt/36)"
            sleep 5
          done

          if [[ "$healthy" != true ]]; then
            echo "Backend failed its health check"
            docker compose --env-file "$CURRENT_IMAGE_FILE" -f "$COMPOSE_FILE" ps
            docker compose --env-file "$CURRENT_IMAGE_FILE" -f "$COMPOSE_FILE" logs --tail=200 backend
            exit 1
          fi

          if ! curl --fail --silent --show-error --max-time 10 \
            http://127.0.0.1:5005/ready >/dev/null; then
            echo "Backend failed its readiness check"
            docker compose --env-file "$CURRENT_IMAGE_FILE" -f "$COMPOSE_FILE" ps
            docker compose --env-file "$CURRENT_IMAGE_FILE" -f "$COMPOSE_FILE" logs --tail=200 backend
            exit 1
          fi

          echo "Backend health and readiness checks passed"
          docker image prune --force
          REMOTE_SCRIPT
