<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/logo-monogram.png" type="image/png" />
    <link rel="dns-prefetch" href="//api.ssjewellry.com" />
    <link rel="preconnect" href="https://api.ssjewellry.com" crossorigin />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>SSJewellery | Premium Luxury Jewellery</title>
    <meta name="description" content="Explore SSJewellery, a curated luxury jewellery store offering exquisite diamonds, necklaces, rings, earrings, bracelets, and bridal collections." />
    <script>
      (function() {
        try {
          const theme = localStorage.getItem('theme');
          if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
